# The most famous line in the pool, and the one nobody can source.
#
# "A journey of a thousand miles begins with a single step" is the best-known
# sentence attributed to Laozi in English. It belongs to no published
# translation that could be identified. That is not a gap in the search; it is
# a property of the sentence.
#
# Measured 2026-09-10. The Chinese is real and is chapter 64:
#
#   千里之行，始於足下
#
# and it says, literally, that a journey of a thousand LI starts BENEATH ONE'S
# FEET. Neither "miles" nor "a single step" is in it. Wikipedia's own article on
# the saying gives the literal sense as "a journey of a thousand li starts
# beneath one's feet", lists three circulating English forms, and attributes
# none of them to a translator.
#
# What the actual translators wrote:
#
#   Legge 1891   "the journey of a thousand li commenced with a single step"
#   Waley 1934   "The journey of a thousand miles began with a foot put down"
#
# The pool's wording is neither. It is the proverb as English absorbed it -
# smoothed, re-measured into miles, and detached from any edition.
#
# THIS IS NOT A COPYRIGHT PROBLEM, IT IS AN ATTRIBUTION ONE. A sentence with no
# identifiable translator has no calculable term, and a folk-smoothed rendering
# is unlikely to belong to anyone. But the pool presents it as a quotation from
# Lao Tzu, and it is a paraphrase of a translation of a text whose author may
# not have existed. The sibling harness in this family avoids the whole question
# by printing Legge's "thousand li" instead, which is why that one is marked
# verified and this one cannot be.
work: "Tao Te Ching chapter 64 - popular English rendering, translator unidentified"
author: "Laozi (traditional attribution)"
author_born: -604
author_died: -531
year: -400
posthumous: true
edition: "Chapter 64. Chinese verified as 千里之行，始於足下, literally a journey of a thousand li starts beneath one's feet. NO EDITION IS NAMED for the English, because none could be identified. Legge 1891 gives the journey of a thousand li commenced with a single step; Waley 1934 gives The journey of a thousand miles began with a foot put down. The pool's wording matches neither."
pd_status_us: "The Chinese original is public domain. The English is a popular rendering with no identifiable translator or edition, so no publication date exists to measure; most likely it belongs to no one, but that is an inference, not a clearance."
pd_status_eu: "The Chinese original is public domain. For the English, EU protection would run for the translator's life plus 70 years, and no translator can be identified, so no term can be calculated. In practice a folk-smoothed proverb is unlikely to be owned by anyone; that remains an inference rather than a fact."
source_url: "https://en.wikipedia.org/wiki/A_journey_of_a_thousand_miles_begins_with_a_single_step"
provenance: unverified
provenance_note: "The Chinese source is verified - chapter 64 of the Tao Te Ching, 千里之行，始於足下. THE ENGLISH IS NOT A PUBLISHED TRANSLATION. It corresponds to no edition that could be located: Legge 1891 writes thousand li commenced, Waley 1934 writes a foot put down, and Wikipedia's article on the saying attributes the popular form to no translator at all and gives the literal sense as starts beneath one's feet - neither miles nor a single step is in the Chinese. It is the proverb as English absorbed it, presented in the pool as a quotation from Lao Tzu. Cheapest fix available, and it is already proven in this family: print Legge's rendering, which is verified and public domain in both jurisdictions."
quotes:
  - "A journey of a thousand miles begins with a single step."
