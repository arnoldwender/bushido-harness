# THE POOL DOCUMENT SAYS "All sources are public-domain." FOR THESE THREE LINES
# THAT IS NOT TRUE, AND THIS FILE IS WHERE THAT WAS FOUND.
#
# Musashi died in 1645, so the JAPANESE is public domain everywhere. The English
# is a different work with its own copyright term, and that is the whole trap
# the family already documented for translations.
#
# Measured 2026-09-10. Two of these three lines are Victor Harris's wording, and
# it can be shown rather than guessed. The Ground Book's nine rules read, in
# Harris's 1974 translation:
#
#   1 Do not think dishonestly.        6 Develop intuitive judgement...
#   2 The Way is in training.          7 Perceive those things which cannot be seen
#   3 Become acquainted with every art 8 Pay attention even to trifles
#   4 Know the Ways of professions     9 Do nothing which is of no use.
#
# Numbers 2 and 9 are in this pool word for word.
#
# The third line, "Today is victory over yourself of yesterday", Wikiquote
# places in the Water Book of Go Rin No Sho and credits to NO translator. Its
# full circulating form is "...; tomorrow is your victory over lesser men",
# which is the Harris phrasing. It could not be confirmed against a printed
# copy, so this file says unverified rather than asserting Harris for it.
#
# VICTOR HARRIS: British Museum Japanese department, Overlook Press 1974, the
# first English translation of Musashi and for a long time the only one. He died
# in 2017. That single fact is what makes these three lines a live question for
# a repository published from Germany, and it is why this file exists instead of
# a one-line "public domain" claim.
work: "Go Rin no Sho (The Book of Five Rings)"
author: "Miyamoto Musashi"
author_born: 1583
author_died: 1645
year: 1645
edition: "Written in the Reigando cave from 1643, completed in the second month of 1645; Musashi died on 13 June 1645. Musashi's birth year is given as c. 1583 and is not certain. English wording as circulated from Victor Harris, A Book of Five Rings, Allison and Busby / The Overlook Press, 1974. The Way is in training and Do nothing which is of no use are rules 2 and 9 of the Ground Book's nine; Today is victory over yourself of yesterday is placed in the Water Book."
translator: "Victor Harris (attributed - see provenance_note)"
translator_died: 2017
pd_status_us: "The 1645 Japanese original is public domain. The ENGLISH IS NOT: Victor Harris's translation was published in 1974, far later than the pre-1930 US threshold, and remains in copyright in the United States."
pd_status_eu: "The Japanese original is public domain - Musashi died 1645. The ENGLISH IS NOT PUBLIC DOMAIN IN THE EU: translator Victor Harris died 2017, and 2017 plus 70 means the translation is protected until 2088. This repository is published from Germany, where that term applies."
source_url: "https://en.wikiquote.org/wiki/Miyamoto_Musashi"
provenance: unverified
provenance_note: "The attribution to Musashi and to Go Rin no Sho is sound; the ENGLISH WORDING is the problem. The Way is in training and Do nothing which is of no use match rules 2 and 9 of the Ground Book's nine rules in Victor Harris's 1974 translation, confirmed against a reproduction of that list. Today is victory over yourself of yesterday could not be confirmed against any printed edition - Wikiquote places it in the Water Book and credits no translator at all, and the circulating wording is the Harris phrasing. Consequence, and the reason this is not a footnote: PRECEPTS.md states that all sources are public-domain, and for these three lines that is false. The Japanese is public domain; the English is a 1974 translation whose translator died in 2017. Needs a decision from the author before this repository is made public: replace these with a public-domain rendering, license the Harris wording, or state plainly in PRECEPTS.md which lines are not public domain."
quotes:
  - "Today is victory over yourself of yesterday."
  - "The Way is in training."
  - "Do nothing which is of no use."
