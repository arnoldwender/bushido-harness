# The textbook case of the rule the family already wrote down: US public domain
# and EU copyright are different questions, and a translation carries its own
# term on top of the author's.
#
# Both lines were verified verbatim on 2026-09-10 against Project Gutenberg
# ebook 132, which is Giles's own 1910 volume - "Sun Tzu on The Art of War, the
# Oldest Military Treatise in the World, translated from the Chinese with
# Introduction and Critical Notes by Lionel Giles, M.A., Assistant in the
# Department of Oriental Printed Books and MSS. in the British Museum, 1910":
#
#   III.2   "Hence to fight and conquer in all your battles is not supreme
#            excellence; supreme excellence consists in breaking the enemy's
#            resistance without fighting."
#   III.18  "Hence the saying: If you know the enemy and know yourself, you need
#            not fear the result of a hundred battles."
#
# The pool prints both correctly. The wording is not the problem.
#
# THE PROBLEM IS THE DATE OF DEATH, NOT THE DATE OF PUBLICATION. Lionel Giles
# was born 29 December 1875 and died 22 January 1958. Published 1910, the
# translation has been public domain in the United States for decades - which is
# why Project Gutenberg can host it, and why it is easy to read that as "public
# domain" and stop. Under EU life-plus-70 the clock runs from 1958, not 1910:
# 1958 + 70 = 2028, so this translation enters the EU public domain on
# 1 January 2029. It is NOT public domain in Germany today, and this repository
# is published from Germany.
#
# Project Gutenberg hosting a text is evidence about US law and about nothing
# else.
work: "The Art of War (Sun Tzu on The Art of War)"
author: "Sun Tzu (Sun Wu) - traditional attribution, historicity disputed"
author_born: -544
author_died: -496
year: -400
posthumous: true
edition: "Lionel Giles, Sun Tzu on The Art of War, London, 1910; chapter III sections 2 and 18. Sun Tzu's dates are the traditional 544-496 BC and his historical existence is disputed; scholarship dates the earliest parts of the text to the Warring States period, at least a century after him, hence the posthumous flag."
translator: "Lionel Giles"
translator_died: 1958
pd_status_us: "Public domain in the United States. Giles's translation was published in 1910, well before the pre-1930 threshold, and is hosted by Project Gutenberg."
pd_status_eu: "NOT PUBLIC DOMAIN IN THE EU TODAY. EU protection runs for the translator's life plus 70 years, not from publication: Lionel Giles died on 22 January 1958, and 1958 plus 70 is 2028, so this translation enters the EU public domain on 1 January 2029. It is still protected in Germany, where this repository is published. Project Gutenberg hosting it is evidence about US law only."
source_url: "https://www.gutenberg.org/files/132/132-h/132-h.htm"
provenance: verified
provenance_note: "Wording verified verbatim against Giles's own 1910 volume. Marked verified because the quotation and its translator are certain - the flag that matters here is not provenance but the EU copyright term, spelled out in pd_status_eu. PRECEPTS.md states that all sources are public-domain; for these two lines that is true in the United States and false in the European Union until 2029. Needs a decision from the author before this repository is made public."
quotes:
  - "If you know the enemy and know yourself, you need not fear the result of a hundred battles."
  - "Supreme excellence consists in breaking the enemy's resistance without fighting."
