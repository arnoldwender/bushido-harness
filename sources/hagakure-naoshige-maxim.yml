provenance_note: "Verified on 2026-09-10 against three independent reproductions of the Book One passage, agreeing on wording and differing only in kyujitai. Both defects the audit found are now fixed in the pool itself: the English is gone, and the maxim is credited to Nabeshima Naoshige with the Hagakure named as the place it was written down rather than as its author. What is quoted is the Japanese only; the English in parentheses is the editor's gloss and says so on the printed line."
