# RESOLVED 2026-09-10, and this line had TWO defects, not one.
#
# DEFECT ONE - COPYRIGHT. The English printed was William Scott Wilson's, from
# his Hagakure (Kodansha International, 1979). Wilson was born in 1944 and is
# alive, so there is no arithmetic to do: the translation is in copyright in the
# United States and in the EU and will be for his lifetime plus seventy. It was
# the least ambiguous non-public-domain line in the pool. No public-domain
# English Hagakure exists to swap in - Wilson's 1979 volume and Takao Mukoh's
# 1980 one are the early ones, and both are modern - so the pool now prints the
# JAPANESE, which is public domain beyond argument, with an editorial gloss
# marked as a gloss on the line itself.
#
# DEFECT TWO - ATTRIBUTION, and this is the one no reader could have caught. The
# pool credited the line to Yamamoto Tsunetomo. In the Hagakure it is not his.
# Book One reads:
#
#   直茂公の御壁書に、「大事の思案は軽くすべし。」とあり。一鼎の註には、
#   「小事の思案は重くすべし。」と致され候。
#
# Tsunetomo is REPORTING a maxim from the wall writings (壁書) of Lord Nabeshima
# Naoshige, and then recording Ishida Ittei's reply to it. Crediting it flatly
# to Tsunetomo is the same species of error as citing a line of dialogue to the
# novelist. The pool now names Naoshige and says where the maxim was recorded.
#
# Naoshige lived 12 April 1538 to 24 July 1618. The Hagakure was dictated to
# Tashiro Tsuramoto around 1709-1716, roughly a century after his death, which
# is why this file carries `posthumous: true` - the flag exists precisely so a
# gap like that is declared rather than looking like a wrong date.
#
# Japanese verified 2026-09-10 against three independent reproductions of the
# passage, which agree on wording and differ only in kyujitai: ask-shidou.com's
# 葉隠 original-plus-translation list and shisokuyubi.com both print 輕 where the
# third, note.com/josanjin, prints 軽. The pool prints the modern 軽.
work: "Hagakure (The Book of the Samurai), Book One - the wall maxims of Nabeshima Naoshige as recorded there"
author: "Nabeshima Naoshige (the maxim is his; the record of it is Yamamoto Tsunetomo's)"
author_born: 1538
