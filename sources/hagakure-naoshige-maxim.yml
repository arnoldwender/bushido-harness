year: 1716
posthumous: true
edition: "The maxim comes from Naoshige's 御壁書, his wall writings. It is preserved in the Hagakure, dictated by Yamamoto Tsunetomo (1659-1719) to Tashiro Tsuramoto c. 1709-1716, in Book One, where Tsunetomo quotes it and then records Ishida Ittei's reply, 小事の思案は重くすべし - small matters should be weighed heavily. Kyujitai variant 輕 appears in some reproductions where the pool prints 軽."
gloss: "The parenthesised English on the pool line is an editorial gloss written for this repository. It is NOT a translation quoted from any published edition, and it is marked as a gloss on the line itself."
pd_status_us: "Public domain in the United States. The Japanese maxim is Naoshige's, who died in 1618, recorded in a text dictated by 1716 - centuries before the pre-1930 threshold. NO TRANSLATION IS PRINTED, so no translator's term attaches."
pd_status_eu: "Public domain in the EU. Nabeshima Naoshige died in 1618 and Yamamoto Tsunetomo, who recorded the maxim, died in 1719; life plus 70 ran out in 1688 and 1789 respectively, so the Japanese is free in Germany, where this repository is published. No translator's term applies because no translation is printed: the parenthesised English is the editor's own gloss, an original line owned by this repository and released under its MIT licence. This is what replaced William Scott Wilson's 1979 wording, which is not public domain anywhere - Wilson, born 1944, is living, so the term has not begun to run."
