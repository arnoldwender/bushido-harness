# The two Dokkodo lines. The work is certain; the English has no translator at
# all, and that is not a small gap - it means the copyright status of the words
# actually printed here CANNOT BE ESTABLISHED.
#
# Measured 2026-09-10. Both lines are precepts of the Dokkodo, in the standard
# order:
#
#   1  Accept everything just the way it is.
#   4  Think lightly of yourself and deeply of the world.
#
# The Dokkodo itself is solid: 21 precepts, written about a week before Musashi
# died in 1645, given to his disciple Terao Magonojo as he disposed of his
# possessions.
#
# WHAT IS MISSING IS THE TRANSLATOR. Wikiquote reproduces this exact English
# list and cites, for the whole section, a single blog URL - no translator, no
# edition, no year. That is the entire provenance available for a wording this
# repo prints in quotation marks with a name after it. A 1992 translation by
# Colin Hyakutake-Watkin is documented to exist, and Victor Harris's 1974 volume
# is often bound with a rendering of the Dokkodo, but whether either produced
# THIS wording could not be confirmed, and guessing would be the fabrication
# this gate exists to prevent.
#
# So the honest statement is the uncomfortable one: nobody can currently say
# whether these two lines are free to publish. An unknown translator is not the
# same as no translator.
work: "Dokkodo (The Way of Walking Alone)"
author: "Miyamoto Musashi"
author_born: 1583
author_died: 1645
year: 1645
edition: "21 precepts, written about one week before Musashi's death on 13 June 1645 and given to his disciple Terao Magonojo. The two lines used here are precepts 1 and 4. Musashi's birth year is given as c. 1583 and is not certain. NO EDITION IS NAMED for the English wording, because none could be identified."
pd_status_us: "The 1645 Japanese original is public domain. The STATUS OF THE ENGLISH CANNOT BE ESTABLISHED: no translator and no edition could be identified, so there is no publication date to measure against the pre-1930 threshold."
pd_status_eu: "The Japanese original is public domain - Musashi died 1645. THE ENGLISH CANNOT BE CLEARED: EU protection for a translation runs for the translator's life plus 70 years, and the translator here is unknown, so the term cannot be calculated. Unknown is not the same as expired."
source_url: "https://en.wikiquote.org/wiki/Miyamoto_Musashi"
provenance: unverified
provenance_note: "The work, the date and the precept numbers are verified - these are precepts 1 and 4 of the Dokkodo, written a week before Musashi died in 1645. THE TRANSLATOR IS UNKNOWN. Wikiquote reproduces this exact English list and cites one blog URL for the whole section, with no translator, edition or year. A 1992 translation by Colin Hyakutake-Watkin exists and Victor Harris's 1974 volume is often bound with a Dokkodo rendering, but neither could be confirmed as the source of THIS wording. Because the translator is unknown, the copyright term cannot be calculated in either jurisdiction, which directly contradicts the claim in PRECEPTS.md that all sources are public-domain. Needs a decision from the author: identify the edition, commission or write a rendering that can be cleared, or say in PRECEPTS.md that these lines are of unestablished status."
quotes:
  - "Accept everything just the way it is."
  - "Think lightly of yourself and deeply of the world."
