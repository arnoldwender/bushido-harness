# CODEX.md III opens with a Japanese proverb rather than a named author:
#
#   > *Bushi ni nigon wa nai — a warrior has no second word.*
#
# The gate's extractor does not reach it: the quotation is not delimited end to
# end, so it reads as prose. It is recorded here anyway, because the audit's job
# was the citations in this repository, not only the ones a regular expression
# happens to catch.
#
# Verified 2026-09-10. 武士に二言はない is a documented kotowaza, carried by
# Japanese dictionaries and proverb references (japandict, kotobank, imidas):
# a samurai does not go back on his word - literally, the warrior does not speak
# twice. The repo's English is a faithful and conventional rendering of it.
#
# A proverb has no author and no first edition, so author_born and author_died
# hold the honest answer rather than a plausible number. The gate's date
# arithmetic skips fields that are not integers, which is the correct behaviour
# here: there is nothing to check.
